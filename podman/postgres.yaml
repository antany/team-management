apiVersion: v1
kind: Pod
metadata:
  name: team-db
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:17
      env:
        - { name: POSTGRES_DB, value: team }
        - { name: POSTGRES_USER, value: team }
        - { name: POSTGRES_PASSWORD, value: team }
      ports:
        - containerPort: 5432
          hostPort: 5434
      volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: team-db-data
