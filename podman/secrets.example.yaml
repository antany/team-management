# Copy to podman/secrets.yaml (git-ignored), fill in, then: podman kube play podman/secrets.yaml podman/team-pod.yaml
# Keep the real file readable only by you: chmod 600 podman/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: team-secrets
stringData:
  db-password: change-me-to-a-long-random-string   # e.g. openssl rand -base64 24 (avoid characters that need quoting)
  tunnel-token: eyJ-change-me                      # Cloudflare Zero Trust > Networks > Tunnels
